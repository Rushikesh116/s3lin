name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group dev
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy --strict src tests

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.15" }
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.15" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group dev
      - run: coverage run -m pytest
      - run: coverage report

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel in a fresh environment and run it outside the source tree
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python -I -c "import s3lin; print(s3lin.__version__)"
          /tmp/smoke/bin/s3lin --version
          /tmp/smoke/bin/s3lin check "$GITHUB_WORKSPACE/examples/double-create.jsonl" || test $? -eq 1
